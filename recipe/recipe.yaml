schema_version: 1

context:
  version: "0.2.0"

package:
  name: servicex-mcp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/servicex_mcp/servicex_mcp-${{ version }}.tar.gz
  sha256: 7ae99ceb0eed37a5d9955d2cbb85a3268e17a1c03a576c19a48b1120d17612e2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - servicex-mcp=servicex_mcp.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=0.7
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - mcp >=2.0,<3
    - httpx2 >=2.0.0
    - pydantic >=2.11
    - servicex >=3.3.0
    - starlette >=0.27
    - uvicorn >=0.31.1
    - af-credentials >=0.3.1

tests:
  - python:
      imports:
        - servicex_mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - servicex-mcp --help

about:
  summary: An MCP server that exposes ServiceX operations as tools for LLMs.
  homepage: https://servicex-mcp.readthedocs.io/en/latest/
  repository: https://github.com/maniaclab/servicex-mcp
  documentation: https://maniaclab.uchicago.edu/servicex-mcp/
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - kratsg
